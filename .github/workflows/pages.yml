name: static-demo
on: workflow_dispatch  # manual trigger only: publishing the demo is a user decision (Q9)
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version-file: .nvmrc}
      - run: uv sync --all-extras
      - run: uv run gravanom export-static-demo --out frontend/public/demo   # synthetic only
      - run: cd frontend && npm ci && npm run build:static
      - uses: actions/upload-pages-artifact@v3
        with: {path: frontend/dist-static}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/deploy-pages@v4
